services:
    ttc:
        image: vanipro/rna:arm64
        container_name: ttc
        working_dir: /root/catkin_ws
        volumes:
            - ./:/root
        devices:
            - /dev/video0:/dev/video0
            - /dev/ttyACM1:/dev/ttyACM1
            - /dev/ttyUSB0:/dev/ttyUSB0
            - /dev/spidev0.0:/dev/spidev0.0
        environment:
            - ROS_IP=${HOST_IP}
            - ROS_HOSTNAME=${HOST_IP}
            - ROS_MASTER_URI=http://${HOST_IP}:11311
        tty: true
        stdin_open: true
        privileged: true
        network_mode: host
        command: >
            bash -c "
            source /opt/ros/noetic/setup.sh &&
            source /root/catkin_ws/devel/setup.sh &&
            catkin_make &&
            source /root/catkin_ws/devel/setup.sh &&
            roslaunch navigation all.launch"
