services:
  demo-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-client
    environment:
      - CMD_HOST=host.docker.internal
      - CMD_PORT=5555
      - TEL_HOST=0.0.0.0
      - TEL_PORT=5600
      - PROTO=tcp
    volumes:
      - .:/app
    working_dir: /app
    command: python -u main.py
    ports:
      - 5600:5600
    extra_hosts:
      - "host.docker.internal:host-gateway"
