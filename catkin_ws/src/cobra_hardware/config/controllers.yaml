joint_state_controller:
    type: "joint_state_controller/JointStateController"
    publish_rate: 50.0

cobra_base_controller:
    type: "diff_drive_controller/DiffDriveController"
    left_wheel: 'left_wheel'
    right_wheel: 'right_wheel'
    publish_rate: 50.0
    wheel_separation: 0.153
    wheel_radius: 0.0745
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: false
    cmd_vel_timeout: 0.25
    velocity_rolling_window_size: 6
    pose_covariance_diagonal: [0.02, 0.02, 1e6, 1e6, 1e6, 0.5]
    twist_covariance_diagonal: [0.05, 0.05, 1e6, 1e6, 1e6, 0.5]
    linear:
        x:
            has_velocity_limits: false
            max_velocity: 1.0
            min_velocity: -0.5
    angular:
        z:
            has_velocity_limits: false
            max_velocity: 1.7
            min_velocity: -1.7