# Cobra Hardware Parameters
cobra_hardware:
  # Serial communication
  port: "/dev/ttyACM0"
  baud: 115200
  
  # Control loop
  loop_hz: 50
  
  # Robot dimensions - loaded from cobra_params.yaml
  wheel_base: 0.153      # Same as wheel.separation in cobra_params.yaml
  wheel_radius: 0.03725  # Same as wheel.radius in cobra_params.yaml
  
  # Joint names - loaded from cobra_params.yaml
  left_joint: "left_wheel"      # Same as joints.left_wheel in cobra_params.yaml
  right_joint: "right_wheel"    # Same as joints.right_wheel in cobra_params.yaml
